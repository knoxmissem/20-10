<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffd3e4">
<title>Thiệp 20/10</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600&family=Dancing+Script:wght@600&family=Playfair+Display:ital,wght@0,600;1,600;1,700&display=swap">
<style>
[hidden]{display:none!important}
html{background:#fff1f6}
@supports not (aspect-ratio:1){.card{min-height:calc(var(--w) * 1.4)}}
:root{
  --blush:#fff1f6;
  --petal:#ffcfe1;
  --rose:#f0689f;
  --berry:#b3215a;
  --wine:#4a1530;
  --muted:#7d3b58;
  --paper:#fffafc;
  --shadow:rgba(179,33,90,.34);
  --display:'Playfair Display',Georgia,serif;
  --script:'Dancing Script',cursive;
  --body:'Be Vietnam Pro',system-ui,sans-serif;
  color-scheme:light;
}
*,*::before,*::after{box-sizing:border-box}
html{height:100%}
body{
  margin:0;
  min-height:100vh;
  min-height:100dvh;
  padding-top:calc(clamp(20px,5vh,56px) + env(safe-area-inset-top,0px));
  padding-bottom:calc(clamp(20px,5vh,56px) + env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  display:grid;
  grid-template-columns:minmax(0,1fr);
  place-items:center;
  overflow-x:hidden;overflow-x:clip;
  font-family:var(--body);
  font-size:16px;
  color:var(--wine);
  background:
    radial-gradient(60rem 38rem at 88% -12%,var(--petal),transparent 62%),
    radial-gradient(48rem 34rem at -12% 112%,#ffc2da,transparent 62%),
    var(--blush);
}
#petals{position:fixed;top:0;right:0;bottom:0;left:0;width:100%;height:100%;pointer-events:none;z-index:0}
.app{position:relative;z-index:1;width:100%;max-width:1000px;margin-inline:auto}
button,input{font:inherit}
:focus-visible{outline:3px solid var(--berry);outline-offset:3px}
input:focus,input:focus-visible{outline:0;box-shadow:none}

.intro{
  display:grid;
  justify-items:center;
  gap:18px;
  max-width:560px;
  margin-inline:auto;
  text-align:center;
  transition:opacity .5s,transform .5s;
}
.intro.leaving{opacity:0;transform:translateY(-14px);pointer-events:none}
.intro>*{animation:fadeUp .9s cubic-bezier(.2,.8,.2,1) backwards}
.intro>:nth-child(2){animation-delay:.08s}
.intro>:nth-child(3){animation-delay:.16s}
.intro>:nth-child(4){animation-delay:.24s}
.eyebrow{
  margin:0;
  font-size:.78rem;
  font-weight:600;
  letter-spacing:.22em;
  text-transform:uppercase;
  color:var(--berry);
}
.dateWrap{position:relative;display:inline-block}
.date{
  margin:0;
  padding:.04em .06em .1em;
  font:italic 700 clamp(5.5rem,26vw,11.5rem)/1 var(--display);
  letter-spacing:-.03em;
  background:linear-gradient(160deg,var(--rose),var(--berry));
  -webkit-background-clip:text;
  background-clip:text;
  color:transparent;
}
.sp{position:absolute;aspect-ratio:1;pointer-events:none}
.s1{width:30%;left:-12%;top:-10%;color:var(--petal);transform:rotate(-14deg)}
.s2{width:24%;right:-8%;bottom:2%;color:var(--rose);opacity:.7;transform:rotate(22deg)}
.lead{margin:0;max-width:34ch;line-height:1.65;color:var(--muted)}
form{width:min(100%,460px);display:grid;gap:10px;text-align:left}
label{padding-left:20px;font-size:.85rem;font-weight:600;color:var(--berry)}
.field{
  display:flex;
  gap:8px;
  padding:6px;
  background:#fff;
  border:2px solid var(--petal);
  border-radius:999px;
  box-shadow:0 16px 32px -20px var(--shadow);
  transition:border-color .2s,box-shadow .2s;
}
.field:focus-within{border-color:var(--rose);box-shadow:0 0 0 4px rgba(240,104,159,.22)}
input{
  flex:1 1 0;
  min-width:0;
  padding:12px 16px;
  border:0;
  outline:0;
  background:transparent;
  font-weight:500;
  font-size:1.05rem;
  color:var(--wine);
}
input::placeholder{color:#b987a0}
.btn{
  flex:none;
  padding:12px 22px;
  border:0;
  border-radius:999px;
  cursor:pointer;
  font-weight:600;
  font-size:.95rem;
  color:#fff;
  background:linear-gradient(135deg,var(--rose),var(--berry));
  transition:transform .2s,box-shadow .2s;
}
.btn:hover{transform:translateY(-1px);box-shadow:0 10px 20px -10px var(--shadow)}
.btn:active{transform:scale(.97)}
.ghost{
  padding:11px 20px;
  border:1.5px solid var(--petal);
  border-radius:999px;
  cursor:pointer;
  font-weight:600;
  font-size:.9rem;
  color:var(--berry);
  background:#fff;
  transition:border-color .2s,transform .2s;
}
.ghost:hover{border-color:var(--rose);transform:translateY(-1px)}
.ghost:active{transform:scale(.97)}
#hint{margin:0;min-height:1.3em;padding-left:20px;font-size:.85rem;color:var(--berry)}

.stage{display:grid;justify-items:center;gap:26px}
.scene{
  width:100%;
  display:grid;
  place-items:center;
  padding-block:8px;
  perspective:1800px;
  -webkit-perspective:1800px;
  overflow-x:hidden;overflow-x:clip;
  animation:rise 1s cubic-bezier(.2,.8,.2,1) backwards;
}
.card{
  --w:min(90vw,400px);
  position:relative;
  display:grid;
  width:var(--w);
  aspect-ratio:5/7;
  border-radius:6px 16px 16px 6px;
  cursor:pointer;
  outline:0;
  transform-style:preserve-3d;
  -webkit-transform-style:preserve-3d;
  transition:transform 1.5s cubic-bezier(.65,.02,.25,1);
  -webkit-tap-highlight-color:transparent;
}
.card:focus-visible{outline:3px solid var(--berry);outline-offset:8px}
@media (min-width:880px){
  .card{--w:380px}
  .card.open{transform:translateX(50%)}
}
.inside{
  grid-area:1/1;
  position:relative;
  display:grid;
  align-content:center;
  padding:clamp(22px,5.5vw,38px) clamp(20px,5vw,34px);
  background:var(--paper);
  border-radius:3px 16px 16px 3px;
  box-shadow:0 34px 60px -26px var(--shadow);
  -webkit-transform:translateZ(0);
  transform:translateZ(0);
  -webkit-backface-visibility:hidden;
  backface-visibility:hidden;
}
.inside::before{
  content:"";
  position:absolute;
  top:10px;right:10px;bottom:10px;left:10px;
  border:1.5px solid var(--petal);
  border-radius:2px 10px 10px 2px;
  pointer-events:none;
}
.inside::after{
  content:"";
  position:absolute;
  top:0;bottom:0;left:0;
  width:26px;
  background:linear-gradient(90deg,rgba(179,33,90,.1),transparent);
  pointer-events:none;
}
.corner{position:absolute;width:46%;aspect-ratio:1;right:-14%;bottom:-8%;color:var(--petal);opacity:.55;transform:rotate(18deg)}
.msg{
  position:relative;
  z-index:1;
  display:grid;
  gap:clamp(8px,2.6vw,13px);
  justify-items:start;
  transition:opacity .3s;
  -webkit-transform:translateZ(0.1px);
  transform:translateZ(0.1px);
}
.msg.swap{opacity:0}
.msg>*{
  opacity:0;
  -webkit-transform:translate3d(0,10px,0);
  transform:translate3d(0,10px,0);
  -webkit-backface-visibility:hidden;
  backface-visibility:hidden;
  transition:opacity .6s ease,-webkit-transform .6s ease,transform .6s ease;
}
.card.open .msg>*{
  opacity:1;
  -webkit-transform:translate3d(0,0,0);
  transform:translate3d(0,0,0);
}
.card.open .msg>*:nth-child(1){transition-delay:1.05s}
.card.open .msg>*:nth-child(2){transition-delay:1.22s}
.card.open .msg>*:nth-child(3){transition-delay:1.39s}
.card.open .msg>*:nth-child(4){transition-delay:1.56s}
.card.open .msg>*:nth-child(5){transition-delay:1.73s}
.to{margin:0;font:600 clamp(1.8rem,7.5vw,2.5rem)/1.15 var(--script);color:var(--berry);overflow-wrap:anywhere}
.title{margin:0;font:italic 600 clamp(1.05rem,4.2vw,1.35rem)/1.25 var(--display);text-wrap:balance}
.text{margin:0;font-size:clamp(.88rem,3.6vw,.96rem);line-height:1.65;color:#5e2a43}
.sign{margin:0;font:600 clamp(1.15rem,4.4vw,1.35rem)/1.3 var(--script);color:var(--berry)}
.foot{margin:0;font-size:.68rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);overflow-wrap:anywhere}

.cover{
  grid-area:1/1;
  position:relative;
  transform:translateZ(1px);
  -webkit-transform:translateZ(1px);
  transform-origin:left center;
  -webkit-transform-origin:left center;
  transform-style:preserve-3d;
  -webkit-transform-style:preserve-3d;
  transition:transform 1.6s cubic-bezier(.65,.02,.25,1);
}
.card.open .cover{
  transform:translateZ(1px) rotateY(-172deg);
  -webkit-transform:translateZ(1px) rotateY(-172deg);
  pointer-events:none;
}
.face{
  position:absolute;
  top:0;right:0;bottom:0;left:0;
  backface-visibility:hidden;
  -webkit-backface-visibility:hidden;
  border-radius:3px 16px 16px 3px;
  -webkit-transform:translate3d(0,0,0);
  transform:translate3d(0,0,0);
}
.front{
  display:grid;
  place-items:center;
  text-align:center;
  color:#fff;
  background:linear-gradient(155deg,#f4709f,#c2255c);
  box-shadow:0 34px 60px -26px var(--shadow);
}
.front::before{
  content:"";
  position:absolute;
  top:12px;right:12px;bottom:12px;left:12px;
  border:1.5px solid rgba(255,255,255,.55);
  border-radius:2px 11px 11px 2px;
}
.front::after{
  content:"";
  position:absolute;
  top:0;right:0;bottom:0;left:0;
  background:linear-gradient(90deg,rgba(0,0,0,.2),rgba(255,255,255,.14) 4%,transparent 11%);
}
.art{position:absolute;aspect-ratio:1;pointer-events:none}
.a1{width:70%;right:-20%;top:-10%;color:#fff;opacity:.3;transform:rotate(14deg)}
.a2{width:48%;left:-14%;bottom:-6%;color:#fff;opacity:.4;transform:rotate(-20deg)}
.a3{width:22%;right:12%;bottom:15%;color:#ffd7e6;opacity:.85;transform:rotate(30deg)}
.a4{width:15%;left:14%;top:13%;color:#fff;opacity:.75;transform:rotate(8deg)}
.crest{position:relative;z-index:2;display:grid;gap:6px;justify-items:center;padding:0 14%}
.crest .small{font-size:.66rem;font-weight:600;letter-spacing:.24em;text-transform:uppercase}
.crest strong{font:italic 700 clamp(3.6rem,17vw,4.9rem)/1 var(--display);letter-spacing:-.02em}
.crest em{font:600 1.5rem/1.2 var(--script);font-style:normal}
.tap{
  position:absolute;
  z-index:2;
  left:0;
  right:0;
  bottom:7%;
  text-align:center;
  font-size:.66rem;
  font-weight:600;
  letter-spacing:.2em;
  text-transform:uppercase;
  opacity:.9;
}
.back{
  display:grid;
  place-items:center;
  padding:12%;
  text-align:center;
  color:var(--berry);
  background:#ffe6f0;
  transform:rotateY(180deg);
  border-radius:16px 3px 3px 16px;
}
.back::before{
  content:"";
  position:absolute;
  top:10px;right:10px;bottom:10px;left:10px;
  border:1.5px solid rgba(240,104,159,.45);
  border-radius:10px 2px 2px 10px;
}
.back::after{
  content:"";
  position:absolute;
  top:0;bottom:0;right:0;
  width:28px;
  background:linear-gradient(270deg,rgba(179,33,90,.12),transparent);
}
.back p{position:relative;z-index:1;margin:0;font:italic 600 1.35rem/1.4 var(--display);text-wrap:balance}
.b1{width:60%;left:-18%;top:-8%;color:var(--rose);opacity:.28;transform:rotate(-10deg)}
.b2{width:44%;right:-12%;bottom:-6%;color:var(--rose);opacity:.3;transform:rotate(24deg)}
.b3{width:18%;right:14%;top:12%;color:#fff;opacity:.9;transform:rotate(12deg)}

.actions{
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  gap:10px;
  opacity:0;
  visibility:hidden;
  transition:opacity .3s,visibility 0s .3s;
}
.stage.is-open .actions{opacity:1;visibility:visible;transition:opacity .7s 2s,visibility 0s}
.status{margin:-12px 0 0;min-height:1.3em;font-size:.85rem;color:var(--berry);text-align:center}

@keyframes fadeUp{from{opacity:0;transform:translateY(16px)}}
@keyframes rise{from{opacity:0;transform:translateY(30px) scale(.94)}}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-delay:0s!important;transition-duration:.01ms!important;transition-delay:0s!important}
}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
.btn,.ghost,.card{touch-action:manipulation}
@media (max-width:879px){
  .cover{transition:transform 1.6s cubic-bezier(.65,.02,.25,1),visibility 0s}
  .card.open .cover{visibility:hidden;transition:transform 1.6s cubic-bezier(.65,.02,.25,1),visibility 0s 1.6s}
}
@supports (height:1dvh){
  @media (max-width:879px){
    .card{--w:min(90vw,400px,calc(68dvh * 5 / 7))}
  }
}
@media (max-width:520px){
  .intro{gap:14px}
  .lead{font-size:.98rem}
  form{width:100%}
  .actions{display:grid;grid-template-columns:1fr 1fr;width:min(100%,400px)}
  .actions .btn{grid-column:1/-1}
  .btn,.ghost{min-height:46px}
}
.clip{position:absolute;top:0;right:0;bottom:0;left:0;overflow:hidden;border-radius:inherit;pointer-events:none}
.cover{-webkit-transform-style:preserve-3d;will-change:transform}
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <defs>
    <symbol id="flower" viewBox="-50 -50 100 100">
      <g fill="currentColor" stroke="#fff" stroke-opacity=".55" stroke-width="1.2">
        <ellipse cx="0" cy="-24" rx="15" ry="25"/>
        <ellipse cx="0" cy="-24" rx="15" ry="25" transform="rotate(72)"/>
        <ellipse cx="0" cy="-24" rx="15" ry="25" transform="rotate(144)"/>
        <ellipse cx="0" cy="-24" rx="15" ry="25" transform="rotate(216)"/>
        <ellipse cx="0" cy="-24" rx="15" ry="25" transform="rotate(288)"/>
      </g>
      <circle r="9" fill="#ffd978"/>
      <circle r="4" fill="#f6b73c"/>
    </symbol>
  </defs>
</svg>

<canvas id="petals" aria-hidden="true"></canvas>

<main class="app">
  <section id="intro" class="intro">
    <p class="eyebrow">Ngày Phụ nữ Việt Nam</p>
    <div class="dateWrap">
      <svg class="sp s1" viewBox="0 0 100 100" aria-hidden="true"><use href="#flower" width="100" height="100"/></svg>
      <h1 class="date">20/10</h1>
      <svg class="sp s2" viewBox="0 0 100 100" aria-hidden="true"><use href="#flower" width="100" height="100"/></svg>
    </div>
    <p class="lead">Có một tấm thiệp nhỏ đang chờ được mở. Cho mình biết tên bạn nhé.</p>
    <form id="form" novalidate>
      <label for="name">Tên của bạn</label>
      <div class="field">
        <input id="name" type="text" maxlength="32" placeholder="Ví dụ: Thu Hà" autocomplete="off" enterkeyhint="go">
        <button class="btn" type="submit">Mở thiệp</button>
      </div>
      <p id="hint" role="alert"></p>
    </form>
  </section>

  <section id="stage" class="stage" hidden>
    <div class="scene">
      <div class="card" id="card" role="button" tabindex="0" aria-expanded="false" aria-label="Thiệp 20/10, bấm để mở hoặc đóng">
        <div class="inside">
          <div class="clip"><svg class="corner" viewBox="0 0 100 100" aria-hidden="true"><use href="#flower" width="100" height="100"/></svg></div>
          <div class="msg" id="msg">
            <p class="to" id="to" style="--i:0"></p>
            <h2 class="title" id="title" style="--i:1"></h2>
            <p class="text" id="text" style="--i:2"></p>
            <p class="sign" id="sign" style="--i:3"></p>
            <p class="foot" id="foot" style="--i:4"></p>
          </div>
        </div>
        <div class="cover">
          <div class="face front">
            <div class="clip">
            <svg class="art a1" viewBox="0 0 100 100" aria-hidden="true"><use href="#flower" width="100" height="100"/></svg>
            <svg class="art a2" viewBox="0 0 100 100" aria-hidden="true"><use href="#flower" width="100" height="100"/></svg>
            <svg class="art a3" viewBox="0 0 100 100" aria-hidden="true"><use href="#flower" width="100" height="100"/></svg>
            <svg class="art a4" viewBox="0 0 100 100" aria-hidden="true"><use href="#flower" width="100" height="100"/></svg>
            </div>
            <div class="crest">
              <span class="small">Ngày Phụ nữ Việt Nam</span>
              <strong>20/10</strong>
              <em>Gửi người con gái tuyệt vời</em>
            </div>
            <span class="tap">Chạm để mở</span>
          </div>
          <div class="face back">
            <div class="clip">
            <svg class="art b1" viewBox="0 0 100 100" aria-hidden="true"><use href="#flower" width="100" height="100"/></svg>
            <svg class="art b2" viewBox="0 0 100 100" aria-hidden="true"><use href="#flower" width="100" height="100"/></svg>
            <svg class="art b3" viewBox="0 0 100 100" aria-hidden="true"><use href="#flower" width="100" height="100"/></svg>
            </div>
            <p>Mỗi cô gái là một đóa hoa riêng</p>
          </div>
        </div>
      </div>
    </div>
    <div class="actions">
      <button class="btn" type="button" id="next">Lời chúc khác</button>
      <button class="ghost" type="button" id="copy">Sao chép lời chúc</button>
      <button class="ghost" type="button" id="again">Viết tên khác</button>
    </div>
    <p class="status" id="status" role="status"></p>
  </section>
</main>

<script>
const wishes=[
  {title:'Chúc mừng ngày 20/10',text:'Chúc {n} có một ngày 20/10 thật vui vẻ, càng ngày càng xinh đẹp, ngày càng thành công hơn trong cuộc sống và nhận được thật nhiều điều mà mình mong muốn nha.',sign:'Thân tặng bạn thật nhiều nụ cười.'},
  {title:'Ngày của những đóa hồng',text:'Hôm nay là ngày của những người phụ nữ tuyệt vời, và {n} chính là một người như thế. Chúc {n} thật nhiều sức khỏe, bình yên trong lòng và những khoảnh khắc nhẹ nhàng đáng nhớ.',sign:'Gửi bạn một cái ôm thật chặt.'},
  {title:'Hôm nay là ngày của bạn',text:'Hãy gác lại mọi bộn bề, pha một ly trà ngọt và tự khen mình một câu nhé. Chúc {n} xinh đẹp, tự tin và luôn có người nhớ đến mình đúng lúc cần nhất.',sign:'Nhớ yêu thương bản thân nhiều hơn nhé.'},
  {title:'Một đóa hoa gửi tặng',text:'Chúc {n} một ngày 20/10 ngập tràn quà, lời khen và tiếng cười. Cầu cho mọi dự định của {n} đều thuận lợi và trái tim luôn được đủ đầy.',sign:'Mong bạn luôn tươi như hoa.'},
  {title:'Cảm ơn vì đã tỏa sáng',text:'Cảm ơn {n} vì đã kiên cường, dịu dàng và tử tế với mọi người xung quanh. Chúc {n} được nghỉ ngơi, được chiều chuộng và được hạnh phúc theo cách mình thích.',sign:'Bạn xứng đáng với mọi điều tốt đẹp.'},
  {title:'Chúc 20/10 thật ngọt',text:'Ngọt như kem dâu, thơm như hoa mới nở và rạng rỡ như nắng sớm. Chúc {n} luôn bình an, xinh tươi và mãi là cô gái mà ai cũng muốn ở cạnh.',sign:'Chúc bạn một mùa hoa thật đẹp.'},
  {title:'Rạng rỡ như nắng mai',text:'Chúc {n} mỗi sáng thức dậy đều thấy lòng nhẹ tênh, mỗi tối đi ngủ đều thấy mình thật may mắn. Mong những điều dịu dàng nhất sẽ luôn tìm đến {n}.',sign:'Hôm nay hãy cười thật tươi nhé.'},
  {title:'Xinh đẹp theo cách riêng',text:'Chúc {n} luôn tự tin với vẻ đẹp rất riêng của mình, gặp thật nhiều người tốt và làm được những điều mình yêu thích. {n} xứng đáng được trân trọng.',sign:'Chúc bạn luôn rực rỡ.'},
  {title:'Gửi bạn một bó hoa',text:'Gửi {n} một bó hoa thật lớn cùng lời chúc bình an, vui vẻ và đủ đầy. Mong năm nay {n} có thêm nhiều chuyến đi, nhiều bữa ăn ngon và nhiều tin vui.',sign:'Chúc bạn một ngày 20/10 thật vui.'},
  {title:'Hạnh phúc nhẹ nhàng thôi',text:'Chúc {n} không cần vội vàng, cứ từ từ mà tỏa sáng. Mong {n} được yêu thương, được nghỉ ngơi khi mệt và luôn có lý do để mỉm cười.',sign:'Mình luôn ủng hộ bạn.'}
];

const $=id=>document.getElementById(id);
const intro=$('intro'),form=$('form'),input=$('name'),hint=$('hint');
const stage=$('stage'),card=$('card'),msg=$('msg');
const to=$('to'),title=$('title'),text=$('text'),sign=$('sign'),foot=$('foot');
const nextBtn=$('next'),copyBtn=$('copy'),againBtn=$('again'),status=$('status');
const calm=matchMedia('(prefers-reduced-motion: reduce)').matches;
const state={full:'',given:'',idx:0};
let statusTimer=0;

const cap=w=>w?w.charAt(0).toLocaleUpperCase('vi')+w.slice(1).toLocaleLowerCase('vi'):w;
const tidy=s=>s.replace(/\s+/g,' ').trim();
const fill=t=>t.split('{n}').join(state.given);

const paint=()=>{
  const w=wishes[state.idx%wishes.length];
  to.textContent='Gửi '+state.given+',';
  title.textContent=w.title;
  text.textContent=fill(w.text);
  sign.textContent=w.sign;
  foot.textContent='Dành riêng cho '+state.full+' · 20/10/2026';
};

const plain=()=>{
  const w=wishes[state.idx%wishes.length];
  return 'Gửi '+state.given+',\n'+w.title+'\n'+fill(w.text)+'\n'+w.sign;
};

const say=t=>{
  status.textContent=t;
  clearTimeout(statusTimer);
  statusTimer=setTimeout(()=>{status.textContent=''},3200);
};

const openCard=()=>{
  card.classList.add('open');
  card.setAttribute('aria-expanded','true');
  stage.classList.add('is-open');
  setTimeout(()=>burst(),650);
};

const closeCard=()=>{
  card.classList.remove('open');
  card.setAttribute('aria-expanded','false');
  stage.classList.remove('is-open');
};

form.addEventListener('submit',e=>{
  e.preventDefault();
  const raw=tidy(input.value);
  if(!raw){
    hint.textContent='Hãy nhập tên của bạn để mở thiệp.';
    input.focus();
    return;
  }
  if(!/[A-Za-zÀ-ỹ]/.test(raw)){
    hint.textContent='Tên cần có ít nhất một chữ cái.';
    input.focus();
    return;
  }
  hint.textContent='';
  input.blur();
  state.full=raw.split(' ').map(cap).join(' ');
  state.given=state.full.split(' ').pop();
  state.idx=Math.floor(Math.random()*wishes.length);
  paint();
  intro.classList.add('leaving');
  setTimeout(()=>{
    intro.hidden=true;
    stage.hidden=false;
    window.scrollTo(0,0);
    card.focus({preventScroll:true});
    setTimeout(openCard,1100);
  },480);
});

card.addEventListener('click',()=>{
  if(card.classList.contains('open'))closeCard();else openCard();
});

card.addEventListener('keydown',e=>{
  if(e.key==='Enter'||e.key===' '){
    e.preventDefault();
    card.click();
  }
});

nextBtn.addEventListener('click',()=>{
  state.idx=(state.idx+1+Math.floor(Math.random()*(wishes.length-1)))%wishes.length;
  msg.classList.add('swap');
  setTimeout(()=>{
    paint();
    msg.classList.remove('swap');
  },320);
});

copyBtn.addEventListener('click',async()=>{
  const value=plain();
  let ok=false;
  if(navigator.clipboard&&window.isSecureContext){
    try{
      await navigator.clipboard.writeText(value);
      ok=true;
    }catch(err){}
  }
  if(!ok){
    const area=document.createElement('textarea');
    area.value=value;
    area.setAttribute('readonly','');
    area.style.position='fixed';
    area.style.top='0';
    area.style.left='-9999px';
    area.style.opacity='0';
    document.body.appendChild(area);
    area.focus();
    area.setSelectionRange(0, value.length);
    try{ok=document.execCommand('copy')}catch(e2){ok=false}
    area.remove();
  }
  say(ok?'Đã sao chép lời chúc.':'Chưa sao chép được, bạn hãy chọn và chép thủ công nhé.');
});

againBtn.addEventListener('click',()=>{
  closeCard();
  setTimeout(()=>{
    stage.hidden=true;
    intro.hidden=false;
    intro.classList.remove('leaving');
    input.value='';
    input.focus();
  },900);
});

const cv=$('petals'),cx=cv.getContext('2d');
const tints=['#ffb3cf','#ff8fb8','#f66d9f','#ffd0e1','#ffffff'];
let W=0,H=0,list=[];

const rand=(a,b)=>a+Math.random()*(b-a);

const make=(x,y,fly)=>({
  x,y,
  s:rand(6,13),
  rot:rand(0,6.28),
  vr:rand(-.03,.03),
  flip:rand(0,6.28),
  vf:rand(.02,.05),
  fall:rand(.5,1.4),
  vx:fly?rand(-4.5,4.5):rand(-.2,.2),
  vy:fly?rand(-10,-3):rand(.3,1),
  sway:rand(.3,1),
  ph:rand(0,6.28),
  c:tints[Math.floor(rand(0,tints.length))],
  a:rand(.55,.95),
  fly
});

const sizeCanvas=()=>{
  const dpr=Math.min(window.devicePixelRatio||1,2);
  W=window.innerWidth;
  H=window.innerHeight;
  cv.width=W*dpr;
  cv.height=H*dpr;
  cx.setTransform(dpr,0,0,dpr,0,0);
  const want=Math.round(Math.min(W,1200)/42);
  list=list.filter(p=>p.fly);
  for(let i=0;i<want;i++)list.push(make(rand(0,W),rand(0,H),false));
};

const draw=p=>{
  cx.save();
  cx.translate(p.x,p.y);
  cx.rotate(p.rot);
  cx.scale(Math.cos(p.flip),1);
  cx.globalAlpha=p.a;
  cx.fillStyle=p.c;
  const s=p.s;
  cx.beginPath();
  cx.moveTo(0,-s);
  cx.bezierCurveTo(s*.9,-s*.6,s*.7,s*.6,0,s);
  cx.bezierCurveTo(-s*.7,s*.6,-s*.9,-s*.6,0,-s);
  cx.fill();
  cx.restore();
};

const step=()=>{
  cx.clearRect(0,0,W,H);
  for(let i=list.length-1;i>=0;i--){
    const p=list[i];
    p.ph+=.02;
    p.rot+=p.vr;
    p.flip+=p.vf;
    p.vy+=(p.fall-p.vy)*.03;
    p.vx+=(0-p.vx)*.02;
    p.x+=p.vx+Math.sin(p.ph)*p.sway;
    p.y+=p.vy;
    if(p.y>H+20||p.x<-40||p.x>W+40){
      if(p.fly){
        list.splice(i,1);
        continue;
      }
      p.y=-20;
      p.x=rand(0,W);
    }
    draw(p);
  }
  requestAnimationFrame(step);
};

function burst(){
  if(calm)return;
  const r=card.getBoundingClientRect();
  const x=r.left+r.width/2;
  const y=r.top+r.height/2;
  for(let i=0;i<40;i++)list.push(make(x+rand(-30,30),y+rand(-30,30),true));
}

sizeCanvas();
window.addEventListener('resize',sizeCanvas);
if(calm){
  list.forEach(draw);
}else{
  requestAnimationFrame(step);
}
</script>
